<!doctype html>
<html><head><meta charset="utf-8"><title>Agent Team</title><style>:root {
  --bg: var(--orca-background, #0f1115);
  --fg: var(--orca-foreground, #e6e6e6);
  --card: var(--orca-card, #161a20);
  --card-fg: var(--orca-card-foreground, var(--fg));
  --pop: var(--orca-popover, var(--card));
  --muted: var(--orca-muted, #1d222a);
  --muted-fg: var(--orca-muted-foreground, #9aa3ad);
  --border: var(--orca-border, #2a2f37);
  --input: var(--orca-input, #2a2f37);
  --primary: var(--orca-primary, #6d8cff);
  --primary-fg: var(--orca-primary-foreground, #fff);
  --secondary: var(--orca-secondary, #232831);
  --secondary-fg: var(--orca-secondary-foreground, var(--fg));
  --accent: var(--orca-accent, #232831);
  --ring: var(--orca-ring, #6d8cff);
  --danger: var(--orca-destructive, #e5484d);
  --radius: var(--orca-radius, 8px);
  --ok: #30a46c;
  --warn: #e5a50a;
  --bad: #e5484d;
  --info: #3e8ef7;
  --c-brief: #a78bfa;
  --c-tasks: #60a5fa;
  --c-plans: #f5a524;
  --c-board: #34d399;
  --c-claims: #f472b6;
  --c-split: #818cf8;
  --c-contexts: #84cc16;
  --c-reports: #22d3ee;
  --c-summary: #e879f9;
  color-scheme: light dark;
}
html.light { color-scheme: light; --ok: #18794e; --warn: #ad5700; --bad: #cd2b31; }
html.dark { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
#root { min-height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: color-mix(in srgb, var(--primary) 35%, transparent); }
a { color: var(--primary); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; }

/* Layout */
.stack { display: flex; flex-direction: column; gap: var(--gap, 8px); min-width: 0; }
.row { display: flex; align-items: center; gap: var(--gap, 8px); min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 240px), 1fr)); }
.pad { padding: 12px; }
.scroll { overflow: auto; }
.sep { height: 1px; background: var(--border); margin: 4px 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* Text */
.muted { color: var(--muted-fg); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.strong { font-weight: 650; }
.h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.h2 { font-size: 15px; font-weight: 650; margin: 0; }
.h3 { font-size: 13px; font-weight: 650; margin: 0; }
.label { font-size: 11px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-fg); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }

/* Surfaces */
.card { background: var(--card); color: var(--card-fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; min-width: 0; }
.card.flat { background: transparent; }
.card.inset { background: var(--muted); border-color: transparent; }
.card.click { cursor: pointer; transition: border-color .12s, background .12s; }
.card.click:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); }
.card.accent { border-left: 3px solid var(--accent-color, var(--primary)); }
.callout { border-radius: var(--radius); padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--tone, var(--primary)) 45%, transparent); background: color-mix(in srgb, var(--tone, var(--primary)) 10%, transparent); }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: calc(var(--radius) - 2px); border: 1px solid var(--border); background: var(--secondary); color: var(--secondary-fg); cursor: pointer; white-space: nowrap; font-weight: 550; transition: background .12s, border-color .12s, opacity .12s; }
.btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--fg) 30%, var(--border)); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.lg { height: 36px; padding: 0 16px; font-size: 14px; }
.btn.icon { width: 28px; padding: 0; }
.btn.block { width: 100%; }
.input, .textarea, .select { width: 100%; border: 1px solid var(--input); background: var(--bg); border-radius: calc(var(--radius) - 2px); padding: 6px 9px; outline: none; transition: border-color .12s, box-shadow .12s; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 25%, transparent); }
.textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
.select { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--muted-fg) 50%), linear-gradient(135deg, var(--muted-fg) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > .hint { font-size: 11px; color: var(--muted-fg); }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius); background: var(--muted); border: 1px solid var(--border); max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: calc(var(--radius) - 3px); cursor: pointer; color: var(--muted-fg); font-weight: 550; white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
.seg button:disabled { cursor: default; opacity: .55; }
.seg.stretch { display: flex; } .seg.stretch button { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 12px; white-space: nowrap; max-width: 100%; }
.chip.on { border-color: var(--chip, var(--primary)); background: color-mix(in srgb, var(--chip, var(--primary)) 16%, transparent); font-weight: 600; }
.chip:disabled { cursor: default; opacity: .55; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: color-mix(in srgb, var(--tone, var(--muted-fg)) 16%, transparent); color: var(--tone, var(--muted-fg)); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone, var(--muted-fg)); flex: none; }
.dot.live { animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.tile { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--tone) 18%, transparent); color: var(--tone); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tabs button { border: 0; background: transparent; padding: 8px 10px; cursor: pointer; color: var(--muted-fg); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--fg); border-color: var(--primary); }
.empty { padding: 22px 12px; text-align: center; color: var(--muted-fg); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--fg) 25%, transparent); border-top-color: var(--primary); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { height: 4px; border-radius: 4px; background: var(--muted); overflow: hidden; }
.progress > div { height: 100%; background: var(--tone, var(--primary)); transition: width .3s; }
.kbd { font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--muted); }
.stick { position: sticky; top: 0; z-index: 2; background: var(--bg); }
.modal-back { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--pop); border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); padding: 16px; box-shadow: 0 20px 50px rgb(0 0 0 / .35); }

/* Agent avatars: the client's mark on a muted tile, the model's mark badged on its bottom-right corner. */
.agent-avatar { position: relative; display: inline-grid; place-items: center; flex: none; background: var(--muted); border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); vertical-align: middle; }
.agent-avatar-client { display: grid; place-items: center; width: 62%; height: 62%; }
.agent-avatar-client > svg, .agent-avatar-model > svg { width: 100%; height: 100%; display: block; }
.agent-avatar .mark-letter { font-weight: 700; line-height: 1; font-size: 60%; }
.agent-avatar-badge { position: absolute; right: -18%; bottom: -18%; display: grid; place-items: center; width: 52%; height: 52%; border-radius: 50%; background: var(--card); border: 1px solid var(--border); padding: 13%; }
.agent-avatar-model { display: grid; place-items: center; width: 100%; height: 100%; }
.agent-avatar-model .mark-letter { font-size: 8px; color: var(--muted-fg); }
html.light .agent-avatar { border-color: color-mix(in srgb, var(--fg) 12%, transparent); }
.member-avatar { position: relative; display: inline-grid; place-items: center; flex: none; }
.member-state { position: absolute; right: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); border: 2px solid var(--card); }
.member-state.live { animation: pulse 1.3s ease-in-out infinite; }

/* Run views: the overview, the component pages and the full-width run report. Colors come from styles.css; `--c` is the
   component (or state) color an element is tinted with. */
:root { --lead: #8f9bff; --flow: #5eaefc; --link: #73b4ff; --c-ink: 72%; --soft: color-mix(in srgb, var(--fg) 4%, var(--card)); --line: color-mix(in srgb, var(--fg) 9%, transparent); }
html.light { --lead: #4655d4; --flow: #1f74d8; --link: #1b62c4; --c-ink: 58%; --soft: color-mix(in srgb, var(--fg) 3%, var(--card)); --line: color-mix(in srgb, var(--fg) 10%, transparent); }
/* Text in a component color, darkened toward the foreground so light themes stay readable. */
.r-ink { color: color-mix(in srgb, var(--c, var(--flow)) var(--c-ink), var(--fg)); }

/* Shared bits ----------------------------------------------------------------------------------------------------- */
.r-section-title { display: flex; align-items: center; gap: 6px; color: var(--muted-fg); min-height: 20px; }
.r-section-title .label { letter-spacing: .05em; }
.r-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.r-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.r-field-label { font-size: 11px; font-weight: 650; color: var(--muted-fg); letter-spacing: .02em; display: flex; align-items: center; gap: 5px; }
.r-text { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.55; }
.r-bullets { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; line-height: 1.5; }
.r-bullets li::marker { color: color-mix(in srgb, var(--c, var(--flow)) 80%, var(--muted-fg)); }
.r-long { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; width: 100%; }
.r-link { border: 0; background: none; padding: 2px 0; color: var(--link); cursor: pointer; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.r-link:hover { text-decoration: underline; }
.r-link.center { align-self: center; }
.r-empty-line { color: var(--muted-fg); font-size: 12px; }
.r-center { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 28px 12px; }
.r-center.full { min-height: 60vh; }
.r-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.r-chips.scroll-x { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.r-chips .chip svg { opacity: .8; }
.r-callout { display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--tone) 35%, transparent); background: color-mix(in srgb, var(--tone) 9%, var(--card)); font-size: 12.5px; line-height: 1.5; }
.r-callout > svg { color: var(--tone); margin-top: 2px; }
.r-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.r-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(var(--min, 300px), 100%), 1fr)); }
.r-list { display: flex; flex-direction: column; gap: 10px; }

.r-party-tag { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; font-size: 12px; font-weight: 600; padding: 1px 0; border: 0; background: none; color: inherit; }
.r-party-tag.click { cursor: pointer; border-radius: 5px; padding: 1px 6px 1px 5px; margin: 0 -6px 0 -5px; max-width: calc(100% + 11px); }
.r-party-tag.click:hover { background: var(--muted); }
.r-party-tag.click:hover .ellipsis { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--fg) 40%, transparent); text-underline-offset: 2px; }
.r-tid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: color-mix(in srgb, var(--c, var(--c-tasks)) 14%, transparent); color: color-mix(in srgb, var(--c, var(--c-tasks)) var(--c-ink), var(--fg)); white-space: nowrap; }
.r-tid.small { font-size: 10px; padding: 0 5px; }
.r-role { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--fg); white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.r-role.any { color: var(--muted-fg); border-style: dashed; }
.r-count { font-size: 11px; font-weight: 700; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--muted); color: var(--muted-fg); }
.badge svg { flex: none; }

/* Event rows */
.r-events { display: flex; flex-direction: column; gap: 2px; }
.r-event { display: flex; gap: 9px; align-items: stretch; padding: 5px 6px; margin: 0 -6px; border-radius: 6px; min-width: 0; }
.r-event.click { cursor: pointer; }
.r-event.click:hover { background: var(--muted); }
.r-event:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.r-event-bar { width: 3px; border-radius: 2px; background: var(--c); flex: none; opacity: .9; }
.r-event-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.r-event-head { display: flex; gap: 8px; align-items: baseline; }
.r-event-text { flex: 1; min-width: 0; font-size: 12px; line-height: 1.45; word-break: break-word; }
.r-event-comp { color: color-mix(in srgb, var(--c) var(--c-ink), var(--fg)); font-weight: 700; }
.r-event-count { margin-left: 5px; font-size: 10.5px; font-weight: 700; color: var(--muted-fg); background: var(--muted); padding: 0 5px; border-radius: 999px; }
.r-event-ago { flex: none; font-size: 10.5px; color: var(--muted-fg); white-space: nowrap; }
.r-event-note { font-size: 11.5px; color: var(--muted-fg); line-height: 1.45; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.r-event-note.open { display: block; -webkit-line-clamp: unset; }

/* Usage bars */
.r-usage { display: flex; flex-direction: column; gap: 9px; }
.r-usage-row { display: grid; grid-template-columns: minmax(70px, 120px) 1fr; gap: 10px; align-items: center; }
.r-usage-name { font-size: 12px; font-weight: 600; }
.r-usage-bars { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.r-usage-bar { display: grid; grid-template-columns: minmax(0, 1fr) 84px; align-items: center; gap: 8px; min-width: 0; }
.r-usage-track { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--fg) 5%, transparent); overflow: hidden; display: block; }
.r-usage-fill { height: 100%; border-radius: 3px; display: block; }
.r-usage-bar.zero .r-usage-num { opacity: .55; }
.r-usage-fill.in { background: var(--c, var(--flow)); }
.r-usage-fill.out { background: color-mix(in srgb, var(--ok) 80%, transparent); }
.r-usage-num { font-size: 10.5px; color: var(--muted-fg); white-space: nowrap; }

/* Data-flow diagram ----------------------------------------------------------------------------------------------- */
.r-diagram { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.r-diagram-head { display: flex; align-items: center; gap: 8px; }
.r-diagram-hint { font-size: 11.5px; color: var(--muted-fg); line-height: 1.45; max-width: 780px; }
.r-live-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; color: var(--ok); text-transform: uppercase; letter-spacing: .05em; }
.r-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--ok)); flex: none; box-shadow: 0 0 0 0 color-mix(in srgb, var(--c, var(--ok)) 60%, transparent); animation: r-ping 1.4s ease-out infinite; }
.r-live-dot.small { width: 6px; height: 6px; }
.r-live-pill .r-live-dot { --c: var(--ok); }
@keyframes r-ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c, var(--ok)) 55%, transparent); } 80%, 100% { box-shadow: 0 0 0 6px transparent; } }

.r-diagram-grid { position: relative; display: grid; grid-template-columns: minmax(130px, 210px) minmax(70px, 150px) minmax(0, 1fr); align-items: center; }
.r-diagram-grid.with-aside { grid-template-columns: 210px minmax(90px, 160px) minmax(280px, 400px) minmax(300px, 1fr); }
.r-parties, .r-cards { display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; z-index: 1; }
.r-diagram-grid > .r-cards { align-self: start; }
.r-diagram-aside { align-self: stretch; margin-left: 20px; padding-left: 20px; border-left: 1px solid var(--border); min-width: 0; position: relative; z-index: 1; }
.r-flow-svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 0; }

.r-party { display: flex; align-items: center; gap: 8px; text-align: left; padding: 7px 9px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--soft); cursor: default; min-width: 0; transition: opacity .15s, border-color .15s, background .15s; }
.r-party:not(:disabled) { cursor: pointer; }
.r-party:not(:disabled):hover { border-color: color-mix(in srgb, var(--fg) 25%, var(--border)); background: var(--card); }
.r-party.lead { border-color: color-mix(in srgb, var(--lead) 45%, var(--border)); }
.r-party.retired { opacity: .55; }
.r-party.dim { opacity: .4; }
.r-party-icon { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); }
.r-party-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.r-party-name { font-size: 12.5px; font-weight: 650; }
.r-party.lead .r-party-name { font-weight: 750; }
.r-party-sub { font-size: 10.5px; color: var(--muted-fg); display: flex; align-items: center; gap: 5px; }
.r-party-sub .dot { width: 6px; height: 6px; }

.r-ccard { display: flex; flex-direction: column; gap: 5px; text-align: left; width: 100%; padding: 9px 11px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); cursor: pointer; min-width: 0; position: relative; transition: border-color .15s, box-shadow .15s, opacity .15s, background .15s; }
.r-ccard::before { content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); opacity: .9; }
.r-ccard:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--border)); }
.r-ccard.live { border-color: color-mix(in srgb, var(--c) 60%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 12%, transparent); }
.r-ccard.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 7%, var(--card)); box-shadow: 0 0 0 1px var(--c); }
.r-ccard.dim { opacity: .45; }
.r-ccard-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.r-ctile { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 17%, transparent); color: var(--c); }
.r-ctile.big { width: 30px; height: 30px; border-radius: 8px; }
.r-ctile.tiny { width: 18px; height: 18px; border-radius: 5px; }
.r-ccard-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; }
.r-ccard-sum { font-size: 11.5px; color: var(--muted-fg); }
.r-ccard-bar { height: 3px; border-radius: 2px; background: var(--muted); overflow: hidden; display: block; }
.r-ccard-bar > span { display: block; height: 100%; background: var(--c); border-radius: 2px; transition: width .4s; }
.r-ccard-last { display: flex; gap: 8px; align-items: baseline; font-size: 11.5px; min-width: 0; }
.r-ccard-last > .ellipsis { flex: 1; min-width: 0; color: color-mix(in srgb, var(--fg) 85%, transparent); }
.r-ccard-ago { flex: none; color: var(--muted-fg); font-size: 10.5px; }

.r-fl { transition: opacity .15s; }
.r-fl-path { fill: none; stroke: var(--c); opacity: .42; }
.r-fl-head { fill: var(--c); opacity: .6; }
.r-fl.live .r-fl-path { opacity: .9; }
.r-fl.live .r-fl-head { opacity: 1; }
.r-fl.dim { opacity: .12; }
.r-fl.hot .r-fl-path { opacity: 1; }
.r-fl.hot .r-fl-head { opacity: 1; }
.r-fl-packet { fill: var(--c); filter: drop-shadow(0 0 3px var(--c)); }
.r-fl-count { font-size: 10.5px; font-weight: 700; fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }

.r-diagram.stacked .r-cards { gap: 7px; }
.r-party-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--soft); font-size: 12px; font-weight: 550; max-width: 100%; cursor: default; }
.r-party-chip:not(:disabled) { cursor: pointer; }
.r-party-chip:not(:disabled):hover { border-color: color-mix(in srgb, var(--fg) 28%, var(--border)); }
.r-party-chip:disabled { opacity: 1; }
.r-party-chip.lead { font-weight: 700; border-color: color-mix(in srgb, var(--lead) 45%, var(--border)); }

/* Overview (sidebar) and component detail ---------------------------------------------------------------------- */
.r-overview { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.r-overview-flows { display: flex; flex-direction: column; gap: 6px; }
.r-pending { border: 1px dashed var(--c); border-radius: var(--radius); background: color-mix(in srgb, var(--c) 7%, var(--card)); }
.r-pending-head { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 11px; border: 0; background: none; cursor: pointer; text-align: left; }
.r-pending-head > .grow { display: flex; flex-direction: column; min-width: 0; }
.r-pending-title { font-weight: 700; font-size: 13px; }
.r-pending-sub { font-size: 11.5px; color: var(--muted-fg); }
.r-pending-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.r-plan-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }

.r-detail { display: flex; flex-direction: column; gap: 12px; min-width: 0; container-type: inline-size; }
.r-detail-head { display: flex; align-items: center; gap: 9px; min-width: 0; }
.r-detail.compact .r-detail-head .h2 { font-size: 14px; }

.r-page { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.r-about { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.5; color: var(--muted-fg); padding: 9px 12px; border-radius: var(--radius); background: color-mix(in srgb, var(--c) 6%, transparent); border: 1px solid color-mix(in srgb, var(--c) 18%, transparent); }
.r-about > svg { color: var(--c); margin-top: 2px; }
.r-page.wide .r-about { max-width: 980px; }
.r-page-foot { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.r-page.wide .r-page-foot { grid-template-columns: minmax(280px, 2fr) minmax(0, 3fr); align-items: start; }

/* Task board --------------------------------------------------------------------------------------------------- */
.r-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.r-progress-line { display: flex; align-items: center; gap: 10px; font-size: 12px; min-width: 200px; }
.r-meter { width: 160px; height: 6px; border-radius: 3px; background: var(--muted); overflow: hidden; display: block; }
.r-meter > span { display: block; height: 100%; background: var(--ok); border-radius: 3px; transition: width .4s; }

.r-kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, .8fr); gap: 12px; align-items: start; }
.r-kcol { background: color-mix(in srgb, var(--fg) 2.5%, var(--bg)); border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
html.light .r-kcol { background: color-mix(in srgb, var(--fg) 3.5%, var(--bg)); }
.r-kcol-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 12px; font-weight: 700; border-top: 3px solid var(--c); }
.r-kcol .r-kcol-head { border-bottom: 1px solid var(--border); }
.r-kcol-body { display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 64px; max-height: calc(100vh - 140px); overflow-y: auto; }
.r-kcol-empty { font-size: 12px; color: var(--muted-fg); text-align: center; padding: 14px 0; border: 1px dashed var(--border); border-radius: var(--radius); }
.r-kstack { display: flex; flex-direction: column; gap: 8px; }
.r-kstack > .r-kcol-head { padding: 4px 2px 0; border-top: 0; }

.r-tcard { display: flex; flex-direction: column; gap: 7px; padding: 10px 11px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); box-shadow: 0 1px 2px rgb(0 0 0 / .06); cursor: pointer; min-width: 0; position: relative; transition: border-color .12s, box-shadow .12s, transform .12s; }
.r-tcard::before { content: ""; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.r-tcard:hover { border-color: color-mix(in srgb, var(--c) 50%, var(--border)); box-shadow: 0 3px 10px rgb(0 0 0 / .12); }
.r-tcard.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 3px 12px rgb(0 0 0 / .14); }
.r-tcard:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.r-tcard.dropped { opacity: .62; }
.r-tcard.dropped .r-tcard-title { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--fg) 35%, transparent); }
.r-tcard-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.r-tcard-title { font-size: 12.5px; font-weight: 600; line-height: 1.42; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.r-tcard-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.r-tcard-foot { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--muted-fg); }
.r-tcard-foot > span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.r-tcard-foot > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.r-tcard-more { cursor: auto; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px; }
.r-tdetail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.r-facts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0; }
.r-facts > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.r-facts dt { font-size: 11px; font-weight: 650; color: var(--muted-fg); }
.r-facts dd { margin: 0; font-size: 12.5px; min-width: 0; }
.r-deps { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.r-deps > span { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
.r-files { display: flex; flex-wrap: wrap; gap: 5px; }
.r-file { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--muted); color: var(--fg); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-file svg { color: var(--muted-fg); }
.r-subcard { border: 1px solid color-mix(in srgb, var(--c) 35%, var(--border)); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--c) 5%, var(--card)); }
.r-subcard-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.r-verdict { font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; padding: 8px 10px; border-radius: 6px; background: var(--muted); border-left: 3px solid var(--c, var(--flow)); }

/* Drawer */
.r-drawer-back { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .28); display: flex; justify-content: flex-end; animation: r-fade .15s ease-out; }
.r-drawer { width: min(520px, 92vw); height: 100%; background: var(--pop); border-left: 1px solid var(--border); box-shadow: -18px 0 40px rgb(0 0 0 / .25); display: flex; flex-direction: column; animation: r-slide .18s ease-out; }
.r-drawer-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
.r-drawer-title { font-size: 15px; font-weight: 700; line-height: 1.35; word-break: break-word; }
.r-drawer-body { padding: 16px; overflow-y: auto; flex: 1; }
@keyframes r-fade { from { opacity: 0; } }
@keyframes r-slide { from { transform: translateX(30px); opacity: .4; } }

/* Plans */
.r-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.r-stat { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); position: relative; overflow: hidden; min-width: 0; }
.r-stat::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--c, var(--flow)); opacity: .85; }
.r-stat-num { font-size: 19px; font-weight: 750; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.r-stat-label { font-size: 11px; color: var(--muted-fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-plan { border: 1px solid var(--border); border-left: 3px solid var(--c); border-radius: var(--radius); background: var(--card); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.r-plan-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.r-plan-title { font-size: 13px; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-plan-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 11.5px; }
.r-plan-meta > span { display: inline-flex; align-items: center; gap: 4px; }

/* Team board */
.r-board { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.r-board-main { min-width: 0; background: color-mix(in srgb, var(--fg) 2.5%, var(--bg)); border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); }
.r-board-aside { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 52px; }
.r-timeline { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.r-timeline.scroll { max-height: min(76vh, 960px); overflow-y: auto; padding: 14px 18px; scroll-behavior: smooth; }
.r-round-divider { display: flex; align-items: center; gap: 10px; color: var(--muted-fg); font-size: 11px; font-weight: 650; margin: 6px 0 10px; }
.r-round-divider::before, .r-round-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.r-post { display: flex; gap: 9px; align-items: flex-start; max-width: min(760px, 92%); }
.r-post.lead { flex-direction: row-reverse; margin-left: auto; }
.r-post.brief { max-width: 100%; }
.r-avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 10.5px; font-weight: 750; letter-spacing: .02em; background: color-mix(in srgb, var(--tone) 20%, var(--card)); color: color-mix(in srgb, var(--tone) var(--c-ink), var(--fg)); border: 1px solid color-mix(in srgb, var(--tone) 35%, transparent); }
.r-bubble { display: flex; flex-direction: column; gap: 5px; padding: 8px 12px 10px; border-radius: 4px 12px 12px 12px; background: var(--card); border: 1px solid var(--border); min-width: 0; flex: 1; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
.r-post.lead .r-bubble { border-radius: 12px 4px 12px 12px; background: color-mix(in srgb, var(--lead) 9%, var(--card)); border-color: color-mix(in srgb, var(--lead) 28%, var(--border)); }
.r-post.brief .r-bubble { border-color: color-mix(in srgb, var(--c-brief) 45%, var(--border)); background: color-mix(in srgb, var(--c-brief) 7%, var(--card)); }
.r-post-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; min-width: 0; flex-wrap: wrap; }
.r-post-head > b { font-size: 12px; max-width: 200px; }
.r-kind { font-size: 10.5px; font-weight: 700; padding: 0 7px; height: 18px; display: inline-flex; align-items: center; border-radius: 999px; color: color-mix(in srgb, var(--c) var(--c-ink), var(--fg)); background: color-mix(in srgb, var(--c) 15%, transparent); }
.r-post-to { color: var(--muted-fg); display: inline-flex; align-items: center; gap: 3px; max-width: 260px; }
.r-post-seq { color: var(--muted-fg); font-size: 10.5px; white-space: nowrap; }
.r-inbox { display: flex; flex-direction: column; gap: 11px; }
.r-inbox-row { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.r-inbox-bar { position: relative; height: 6px; border-radius: 3px; background: var(--muted); overflow: hidden; }
.r-inbox-bar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; transition: width .4s; }
.r-inbox-bar > .delivered { background: color-mix(in srgb, var(--c-board) 35%, transparent); }
.r-inbox-bar > .read { background: var(--c-board); }

/* File claims */
.r-holder { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 11px 12px; display: flex; flex-direction: column; gap: 9px; border-top: 3px solid var(--c-claims); }
.r-claims { display: flex; flex-direction: column; gap: 5px; }
.r-claim { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--muted); min-width: 0; }
.r-claim-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Brief */
.r-brief { border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: var(--card); padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; border-top: 3px solid var(--c-brief); }
.r-brief-title { font-size: 17px; font-weight: 750; letter-spacing: -.01em; margin: 0; line-height: 1.3; }
.r-brief-title.small { font-size: 14px; }
.r-brief-goal { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: var(--radius); background: color-mix(in srgb, var(--c-brief) 7%, transparent); }
.r-brief-goal .r-text { font-size: 13.5px; }
.r-brief-grid { display: grid; gap: 14px 22px; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
.r-brief-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; --c: var(--c-brief); }
.r-quote { border-left: 3px solid var(--c-brief); padding: 6px 12px; font-style: italic; display: flex; flex-direction: column; gap: 3px; }
.r-quote .r-field-label { font-style: normal; }
.r-brief-sent { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-top: 10px; border-top: 1px solid var(--border); }

/* Delegation: batches, packets, contexts, reports */
.r-batch { border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: var(--card); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 3px solid var(--c); }
.r-batch-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.r-batch-no { font-size: 11px; font-weight: 750; padding: 2px 8px; border-radius: 6px; color: color-mix(in srgb, var(--c) var(--c-ink), var(--fg)); background: color-mix(in srgb, var(--c) 15%, transparent); white-space: nowrap; }
.r-batch-title { font-size: 13.5px; font-weight: 650; min-width: 200px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.r-batch-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: var(--muted-fg); }
.r-batch-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.r-packet { display: flex; flex-direction: column; gap: 6px; padding: 10px 11px; border-radius: var(--radius); background: var(--soft); border: 1px solid var(--border); cursor: pointer; min-width: 0; transition: border-color .12s; }
.r-packet:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--border)); }
.r-packet.on { border-color: color-mix(in srgb, var(--c) 60%, var(--border)); background: var(--card); grid-column: 1 / -1; }
.r-packet-head { display: flex; align-items: center; gap: 7px; min-width: 0; }
.r-packet-title { font-size: 12px; color: color-mix(in srgb, var(--fg) 82%, transparent); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.r-packet-more { display: flex; flex-direction: column; gap: 10px; cursor: auto; padding-top: 4px; }
.r-context { border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: var(--card); padding: 12px 14px; display: flex; flex-direction: column; gap: 11px; min-width: 0; position: relative; }
.r-context::after { content: ""; position: absolute; inset: 4px; border: 1px dashed color-mix(in srgb, var(--c-contexts) 30%, transparent); border-radius: var(--radius); pointer-events: none; }
.r-context.retired { opacity: .6; }
.r-context-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.r-context-packets { display: flex; flex-direction: column; gap: 6px; }
.r-context-packet { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 6px; background: var(--muted); cursor: pointer; min-width: 0; position: relative; z-index: 1; }
.r-context-packet:hover { background: color-mix(in srgb, var(--fg) 7%, var(--muted)); }
.r-ctx-tag { font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 999px; color: color-mix(in srgb, var(--c-contexts) var(--c-ink), var(--fg)); background: color-mix(in srgb, var(--c-contexts) 16%, transparent); }
.r-ctx-tag.reused { color: color-mix(in srgb, var(--c-reports) var(--c-ink), var(--fg)); background: color-mix(in srgb, var(--c-reports) 16%, transparent); }
.r-rcard { border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: var(--card); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px; border-left: 3px solid var(--c); }
.r-rcard.retired { opacity: .6; }
.r-rcard-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.r-rcard-head .tiny { display: inline-flex; align-items: center; gap: 4px; }

/* All flows: the matrix */
.r-matrix-wrap { overflow-x: auto; }
.r-matrix { border-collapse: separate; border-spacing: 4px; width: 100%; font-size: 12px; }
.r-matrix th { font-weight: 650; text-align: left; white-space: nowrap; }
.r-matrix thead th button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; color: color-mix(in srgb, var(--c) var(--c-ink), var(--fg)); font-weight: 700; }
.r-matrix thead th button:hover, .r-matrix thead th.on button { background: color-mix(in srgb, var(--c) 14%, transparent); }
.r-matrix th.party { padding-right: 10px; max-width: 200px; }
.r-matrix th.total, .r-matrix td.total { color: var(--muted-fg); text-align: right; font-size: 11px; }
.r-matrix td { padding: 0; border-radius: 6px; background: color-mix(in srgb, var(--c) var(--w, 0%), transparent); height: 30px; text-align: center; transition: opacity .15s; }
html.light .r-matrix td { background: color-mix(in srgb, var(--c) calc(var(--w, 0%) * .7), transparent); }
.r-matrix td.total { background: none; }
.r-matrix td.dim { opacity: .25; }
.r-cell { display: inline-flex; gap: 8px; font-variant-numeric: tabular-nums; font-weight: 650; }
.r-cell.none { color: var(--muted-fg); opacity: .5; }
.r-cell.plain { font-weight: 550; }

/* The run report ---------------------------------------------------------------------------------------------------- */
.r-root { padding: 22px 28px 48px; max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.r-root.narrow { padding: 14px 12px 32px; gap: 12px; }
.r-head { display: flex; flex-direction: column; gap: 12px; }
.r-head-main { display: flex; align-items: flex-start; gap: 14px; min-width: 0; }
.r-head-icon { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
.r-title { font-size: 20px; font-weight: 750; letter-spacing: -.015em; margin: 0 0 6px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.r-head-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.r-status { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 650; border: 1px solid var(--border); color: var(--muted-fg); }
.r-status.active { color: var(--fg); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
.r-head-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.r-head-facts { display: flex; flex-wrap: wrap; gap: 8px 0; margin: 0; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

.r-diagram-panel { padding: 14px 16px 16px; }

.r-tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; overflow-x: auto; background: var(--bg); border-bottom: 1px solid var(--border); margin: 6px 0 0; scrollbar-width: none; }

/* Narrow report: one column everywhere. */
.r-root.narrow .r-head-main { flex-wrap: wrap; }
.r-root.narrow .r-head-actions { width: 100%; justify-content: space-between; }

.r-root.narrow .r-title { font-size: 17px; }
@container (max-width: 520px) { .r-two { grid-template-columns: minmax(0, 1fr); } }

/* Team editor (te-*). Every frame gets every stylesheet, so all selectors here are prefixed. */
.te-page { min-height: 100vh; display: flex; flex-direction: column; }

/* Top bar */

.te-ro { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 650; color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); flex: none; }
.te-bar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.te-undo { display: flex; gap: 2px; padding-right: 8px; border-right: 1px solid var(--border); }
.te-tool { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; border: 0; background: transparent; color: var(--muted-fg); cursor: pointer; flex: none; transition: background .12s, color .12s; }

/* Validation status */
.te-status-wrap { position: relative; }
.te-status { --tone: var(--ok); display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--tone) 38%, transparent); background: color-mix(in srgb, var(--tone) 11%, transparent); color: var(--tone); font-weight: 650; cursor: pointer; white-space: nowrap; transition: background .12s; }

.te-status.bad { --tone: var(--bad); }
.te-status-sub { color: var(--muted-fg); font-weight: 550; padding-left: 7px; border-left: 1px solid color-mix(in srgb, var(--tone) 30%, transparent); }
.te-pop { position: absolute; right: 0; top: calc(100% + 8px); width: min(400px, calc(100vw - 24px)); background: var(--pop); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 44px rgb(0 0 0 / .28); padding: 6px; z-index: 30; animation: te-in .14s ease-out; }
.te-pop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 8px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.te-pop-list { display: flex; flex-direction: column; gap: 1px; max-height: min(60vh, 420px); overflow: auto; }

.te-pop-item:hover { background: var(--muted); }

.te-pop-msg { display: block; font-size: 12.5px; }

/* Layout */
.te-layout { width: 100%; max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 36px; padding: 0 24px; flex: 1; }
.te-main { min-width: 0; padding: 30px 0 48px; max-width: 1080px; }
.te-nav { position: sticky; top: 68px; align-self: start; padding-top: 30px; display: flex; flex-direction: column; gap: 2px; }
.te-nav button { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted-fg); font-weight: 550; cursor: pointer; text-align: left; transition: background .12s, color .12s; }
.te-nav button:hover { background: var(--muted); color: var(--fg); }
.te-nav button.on { background: color-mix(in srgb, var(--primary) 13%, transparent); color: var(--fg); font-weight: 650; }
.te-nav button.on svg { color: var(--primary); }

.te-nav-bad { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.te-nav-foot { margin-top: 16px; padding: 12px 10px 0; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted-fg); line-height: 2.1; }
.te-banner { display: flex; align-items: center; gap: 8px; width: calc(100% - 48px); max-width: 1272px; margin: 14px auto 0; padding: 9px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.te-banner svg { color: var(--warn); }

/* Overview */
.te-hero { padding: 0 0 24px; border-bottom: 1px solid var(--border); scroll-margin-top: 72px; }
.te-name { display: block; width: calc(100% + 10px); margin-left: -10px; font-size: 28px; font-weight: 760; letter-spacing: -0.02em; line-height: 1.25; border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 3px 9px; outline: none; transition: border-color .12s, background .12s, box-shadow .12s; }
.te-name:hover:not(:disabled) { background: color-mix(in srgb, var(--muted) 60%, transparent); }
.te-name:focus { border-color: var(--ring); background: var(--bg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 20%, transparent); }
.te-name::placeholder { color: color-mix(in srgb, var(--muted-fg) 70%, transparent); }
.te-textarea.te-goal { width: calc(100% + 10px); margin: 4px 0 0 -10px; border-color: transparent; background: transparent; font-size: 14px; line-height: 1.55; padding: 5px 9px; color: color-mix(in srgb, var(--fg) 82%, var(--muted-fg)); resize: none; }
.te-textarea.te-goal:hover:not(:disabled) { background: color-mix(in srgb, var(--muted) 60%, transparent); }
.te-textarea.te-goal:focus { border-color: var(--ring); background: var(--bg); }
.te-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.te-fact { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--muted); color: var(--muted-fg); font-size: 12px; font-weight: 550; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.te-fact svg { color: var(--fg); opacity: .65; }

/* Sections */
.te-section { padding: 30px 0 6px; scroll-margin-top: 60px; }
.te-section-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.te-section-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); }
.te-section-actions { flex: none; padding-top: 2px; }
.te-h2 { margin: 0; font-size: 16px; font-weight: 720; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; line-height: 1.35; }
.te-count { font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--muted); color: var(--muted-fg); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.te-sub { margin: 3px 0 0; color: var(--muted-fg); font-size: 12.5px; line-height: 1.5; max-width: 78ch; }
.te-section > .te-issues { margin: -4px 0 12px; }

/* Collaboration mode */
.te-modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; border-radius: 12px; }
.te-mode { --tone: var(--muted-fg); position: relative; display: flex; flex-direction: column; gap: 9px; text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--card-fg); cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; }
.te-mode.m-auto { --tone: var(--c-summary); }
.te-mode.m-team { --tone: var(--c-board); }
.te-mode.m-delegation { --tone: var(--c-split); }
.te-mode:hover:not(:disabled) { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
.te-mode.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 6%, var(--card)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 17%, transparent); }
.te-mode:disabled { cursor: default; }
.te-mode-head { display: flex; align-items: center; gap: 10px; }
.te-mode-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--tone) 15%, transparent); color: var(--tone); transition: background .15s, color .15s; }
.te-mode.on .te-mode-icon { background: color-mix(in srgb, var(--tone) 28%, transparent); }
.te-mode-title { font-weight: 700; font-size: 14px; flex: 1; }
.te-radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--fg) 25%, var(--border)); display: grid; place-items: center; flex: none; color: var(--primary-fg); }
.te-mode.on .te-radio, .te-where-opt.on .te-radio { border-color: var(--primary); background: var(--primary); }
.te-mode-hint { color: var(--muted-fg); font-size: 12px; line-height: 1.5; flex: 1; }
.te-mode-facets { display: flex; flex-wrap: wrap; gap: 4px; }
.te-facet { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 6px; background: var(--muted); color: var(--muted-fg); font-weight: 550; }
.te-facet.pattern { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: color-mix(in srgb, var(--tone) 14%, transparent); color: var(--tone); font-weight: 650; }
.te-lang { display: flex; align-items: center; gap: 12px 18px; margin-top: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); flex-wrap: wrap; }
.te-lang .seg { flex: none; }
.te-label-strong { display: flex; align-items: center; gap: 7px; font-weight: 650; }
.te-label-strong svg { color: var(--muted-fg); }

/* Cards */
.te-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 12px; }
.te-card { --tone: var(--primary); position: relative; display: flex; flex-direction: column; gap: 12px; padding: 14px 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--card-fg); min-width: 0; transition: border-color .15s, box-shadow .15s; }
.te-card::before { content: ""; position: absolute; left: -1px; top: 16px; width: 3px; height: 28px; border-radius: 0 3px 3px 0; background: var(--tone); }
.te-card.cand { --tone: var(--c-board); }
.te-card.cand::before, .te-lead::before { display: none; }
.te-card:focus-within { border-color: color-mix(in srgb, var(--primary) 50%, var(--border)); box-shadow: 0 8px 28px rgb(0 0 0 / .1); }
.te-card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.te-avatar { width: 32px; height: 32px; flex: none; }
.te-card-name { display: block; width: 100%; min-width: 0; font-weight: 650; font-size: 14px; height: 32px; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 0 8px; outline: none; transition: border-color .12s, background .12s, box-shadow .12s; }
.te-card-name:hover:not(:disabled) { border-color: var(--border); }
.te-card-name:focus { border-color: var(--ring); background: var(--bg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 20%, transparent); }
.te-card-name.invalid { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 6%, transparent); }
.te-card-name::placeholder { color: color-mix(in srgb, var(--muted-fg) 80%, transparent); font-weight: 550; }
.te-card-tools { display: flex; gap: 1px; opacity: .5; transition: opacity .15s; }
.te-card:hover .te-card-tools, .te-card:focus-within .te-card-tools { opacity: 1; }
.te-handle { display: flex; align-items: center; position: relative; }
.te-at { position: absolute; left: 8px; color: var(--muted-fg); font-family: ui-monospace, Menlo, monospace; font-size: 13px; pointer-events: none; }
.te-handle .te-card-name { padding-left: 21px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.te-card > .te-issues { margin-top: -8px; }
.te-lead { --tone: var(--c-plans); padding: 14px; }
.te-lead .te-runtime { max-width: 760px; }
.te-add-card { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 42px; margin-top: 12px; border: 1.5px dashed color-mix(in srgb, var(--fg) 16%, var(--border)); border-radius: 12px; background: transparent; color: var(--muted-fg); font-weight: 600; cursor: pointer; transition: border-color .15s, color .15s, background .15s; }
.te-add-card:hover { border-color: var(--primary); color: var(--primary); background: color-mix(in srgb, var(--primary) 5%, transparent); }
.te-empty { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px dashed color-mix(in srgb, var(--fg) 14%, var(--border)); border-radius: 12px; color: var(--muted-fg); flex-wrap: wrap; }
.te-empty-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--muted); flex: none; }
.te-empty-text { flex: 1; min-width: 180px; }

/* Fields */
.te-slot { display: flex; flex-direction: column; gap: 5px; min-width: 0; border-radius: 8px; }
.te-slot-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 16px; }
.te-label { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-fg); }
.te-slot-aside { display: inline-flex; }
.te-hint { font-size: 11.5px; line-height: 1.45; color: var(--muted-fg); }
.te-issues { display: flex; flex-direction: column; gap: 3px; }
.te-issue { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.4; }
.te-issue svg { margin-top: 2px; }
.te-issue.error { color: var(--bad); }
.te-issue.warning { color: var(--warn); }
.te-input, .te-select, .te-textarea { display: block; width: 100%; height: 32px; border: 1px solid var(--input); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 0 10px; outline: none; transition: border-color .12s, box-shadow .12s; }
.te-input.mono, .te-select { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.te-textarea { height: auto; min-height: 0; padding: 8px 10px; line-height: 1.5; resize: vertical; }
.te-input:hover:not(:disabled), .te-select:hover:not(:disabled), .te-textarea:hover:not(:disabled), .te-chips:hover { border-color: color-mix(in srgb, var(--fg) 22%, var(--input)); }
.te-input:focus, .te-select:focus, .te-textarea:focus, .te-chips:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 20%, transparent); }
.te-input.invalid, .te-textarea.invalid, .te-chips.invalid { border-color: var(--bad); }
.te-input.invalid:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }
.te-input::placeholder, .te-textarea::placeholder, .te-chip-input::placeholder { color: color-mix(in srgb, var(--muted-fg) 78%, transparent); }
.te-input:disabled, .te-select:disabled, .te-textarea:disabled, .te-card-name:disabled, .te-name:disabled, .te-chip-input:disabled { cursor: not-allowed; opacity: .75; }
.te-select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer; }
.te-select-wrap { position: relative; min-width: 0; }
.te-select-wrap > svg { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-fg); pointer-events: none; }
.te-runtime { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(92px, .8fr); gap: 8px; }
.te-surface { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.te-surface-label { font-size: 12px; font-weight: 600; color: var(--muted-fg); }
.te-link { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--primary); font-size: 12px; font-weight: 650; cursor: pointer; padding: 0; }
.te-link:hover { text-decoration: underline; }

/* Combobox */
.te-combo { position: relative; min-width: 0; }
.te-combo .te-input { padding-right: 28px; }
.te-combo-toggle { position: absolute; right: 3px; top: 3px; width: 26px; height: 26px; border: 0; background: transparent; color: var(--muted-fg); border-radius: 6px; display: grid; place-items: center; cursor: pointer; }
.te-combo-toggle:hover:not(:disabled) { background: var(--muted); color: var(--fg); }
.te-combo.open .te-combo-toggle svg { transform: rotate(180deg); }
.te-combo-list { position: absolute; left: 0; top: calc(100% + 4px); z-index: 25; min-width: 100%; width: max-content; max-width: 280px; margin: 0; padding: 4px; list-style: none; background: var(--pop); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 14px 34px rgb(0 0 0 / .26); max-height: 248px; overflow: auto; animation: te-in .12s ease-out; }
.te-combo-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.te-combo-list li.active { background: var(--muted); }
.te-combo-list li.on { color: var(--primary); font-weight: 650; }

/* Folder chips */
.te-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 34px; padding: 4px 6px; border: 1px solid var(--input); border-radius: 8px; background: var(--bg); cursor: text; transition: border-color .12s, box-shadow .12s; }
.te-chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 3px 0 8px; border-radius: 6px; max-width: 100%; font-size: 12px; background: color-mix(in srgb, var(--tone, var(--primary)) 11%, transparent); border: 1px solid color-mix(in srgb, var(--tone, var(--primary)) 26%, transparent); }
.te-chip > svg { color: var(--tone, var(--primary)); }
.te-chip > .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.te-chip.empty { border-color: var(--bad); }
.te-chip button { width: 18px; height: 18px; border: 0; background: transparent; border-radius: 4px; display: grid; place-items: center; color: var(--muted-fg); cursor: pointer; flex: none; }
.te-chip button:hover:not(:disabled) { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.te-fieldset:disabled .te-chip button { display: none; }
.te-chip-input { flex: 1; min-width: 140px; border: 0; outline: none; background: transparent; height: 24px; padding: 0 4px; font-size: 12.5px; }

/* Toasts */
.te-toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(480px, calc(100vw - 24px)); pointer-events: none; }
.te-toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 13px; border-radius: 12px; background: var(--pop); border: 1px solid var(--border); box-shadow: 0 16px 40px rgb(0 0 0 / .3); animation: te-in .18s ease-out; }
.te-toast > svg:first-child { color: var(--info); }
.te-toast.ok > svg:first-child { color: var(--ok); }
.te-toast.bad > svg:first-child { color: var(--bad); }
.te-toast-action { border: 0; background: transparent; color: var(--primary); font-weight: 700; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.te-toast-action:hover { background: var(--muted); }
.te-toast-close { width: 24px; height: 24px; border: 0; background: transparent; color: var(--muted-fg); border-radius: 6px; display: grid; place-items: center; cursor: pointer; flex: none; }
.te-toast-close:hover { background: var(--muted); color: var(--fg); }
@keyframes te-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Jump highlight */
.te-flash { animation: te-flash 1.6s ease-out; }
@keyframes te-flash { 0%, 35% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 60%, transparent); } 100% { box-shadow: 0 0 0 3px transparent; } }

.te-foot { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted-fg); font-size: 12px; }

/* A file that isn't a team */
.te-broken { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.te-broken-card { width: min(640px, 100%); padding: 28px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); display: flex; flex-direction: column; align-items: flex-start; gap: 12px; box-shadow: 0 20px 50px rgb(0 0 0 / .12); }
.te-broken-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.te-broken-title { font-size: 20px; font-weight: 720; letter-spacing: -0.01em; margin: 4px 0 0; }
.te-broken-hint { margin: 0; color: var(--muted-fg); }
.te-broken-list { align-self: stretch; margin: 0; padding: 10px 12px; list-style: none; background: var(--muted); border-radius: 10px; display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow: auto; }
.te-broken-list code { white-space: pre-wrap; word-break: break-word; color: var(--bad); }
.te-broken-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

/* Start a session */
.te-modal-back { animation: te-fade .14s ease-out; backdrop-filter: blur(2px); }
@keyframes te-fade { from { opacity: 0; } to { opacity: 1; } }
.te-modal { width: min(660px, 100%); padding: 0; display: flex; flex-direction: column; border-radius: 16px; max-height: calc(100vh - 40px); overflow: hidden; animation: te-in .16s ease-out; }
.te-modal-head { display: flex; gap: 12px; align-items: flex-start; padding: 18px 18px 4px; }
.te-modal-body { display: flex; flex-direction: column; gap: 16px; padding: 14px 18px 18px; overflow: auto; }
.te-modal > .te-callout { margin: 10px 18px 0; }
.te-modal-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.te-modal-row .seg { width: 100%; }
.te-modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 45%, transparent); }
.te-where { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.te-where-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--card-fg); text-align: left; cursor: pointer; min-width: 0; transition: border-color .12s, box-shadow .12s; }
.te-where-opt > svg { color: var(--muted-fg); }
.te-where-opt.on { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
.te-where-opt.on > svg { color: var(--primary); }
.te-where-title { display: block; font-weight: 650; }
.te-where-sub { display: block; font-size: 11.5px; color: var(--muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.te-place { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--muted); }
.te-place > svg { margin-top: 3px; color: var(--muted-fg); }
.te-place-branch { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; font-size: 11.5px; color: var(--muted-fg); }
.te-place-path { display: block; color: var(--muted-fg); font-size: 11.5px; word-break: break-all; margin-top: 2px; }
.te-callout { --tone: var(--info); display: flex; gap: 9px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--tone) 38%, transparent); background: color-mix(in srgb, var(--tone) 9%, transparent); font-size: 12.5px; line-height: 1.5; }
.te-callout.bad { --tone: var(--bad); }
.te-callout.warn { --tone: var(--warn); }
.te-callout > svg { color: var(--tone); margin-top: 2px; flex: none; }

/* Narrower tabs */
@media (max-width: 1120px) {
  .te-layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .te-nav { display: none; }
  .te-main { max-width: none; }
}
@media (max-width: 640px) {
  .te-bar-in { padding: 8px 12px; }
  .te-layout { padding: 0 14px; }
  .te-banner { width: calc(100% - 28px); }
  .te-main { padding-top: 20px; }
  .te-hide-sm { display: none; }
  .te-name { font-size: 22px; }
  .te-modes { grid-template-columns: minmax(0, 1fr); }
  .te-mode { gap: 6px; padding: 12px; }
  .te-section { padding-top: 24px; scroll-margin-top: 100px; }
  .te-pop { position: fixed; left: 12px; right: 12px; top: 96px; width: auto; }
  .te-where { grid-template-columns: minmax(0, 1fr); }
  .te-modal-foot .te-hint { display: none; }
}
@media (max-width: 460px) {
  .te-runtime { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .te-runtime > :first-child { grid-column: 1 / -1; }
}

/* The tone colors are made for dark surfaces; on light ones their text and icons need more depth. */
html.light .te-avatar, html.light .te-facet.pattern, html.light .te-section-icon, html.light .te-mode-icon, html.light .te-chip > svg { color: color-mix(in srgb, var(--tone, var(--primary)) 62%, #000); }
html.light .te-avatar, html.light .te-section-icon, html.light .te-mode-icon { background: color-mix(in srgb, var(--tone) 20%, transparent); }
